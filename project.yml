name: VideoPipelineSuite
options:
  bundleIdPrefix: com.myanmardev
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.70-fe61d641

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "5"
    PRODUCT_NAME: "VideoPipelineSuite"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO

targets:
  VideoPipelineSuite:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VideoPipelineSuite
        excludes:
          - "**/*.md"
          - "Info.plist"
    dependencies:
      - package: TDLibKit
        product: TDLibKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myanmardev.videopipeline
        INFOPLIST_FILE: VideoPipelineSuite/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
