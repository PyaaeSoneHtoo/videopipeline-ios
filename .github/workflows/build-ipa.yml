name: Build and Release Unsigned iOS IPA

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile iOS Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Compile Release App (Unsigned arm64)
        run: |
          xcodebuild \
            -project VideoPipelineSuite.xcodeproj \
            -scheme VideoPipelineSuite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned IPA
        run: |
          mkdir -p dist/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found!"
            exit 1
          fi
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -r -y VideoPipelineSuite-v1.2.0-unsigned.ipa Payload
          rm -rf Payload
          ls -lh VideoPipelineSuite-v1.2.0-unsigned.ipa

      - name: Upload Unsigned IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPipelineSuite-iOS-Unsigned-IPA
          path: dist/*.ipa
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0-ios
          name: "Video Pipeline Suite for iOS v1.2.0 (Unsigned IPA)"
          body: |
            ### 🍎 Video Pipeline Suite for iOS v1.2.0 (Unsigned IPA)

            Studio-grade UI overhaul for both **Downloader** and **Uploader**:
            - 📥 **Downloader Studio UI**: 3-tab Studio (`Bot Inbox` with search/filter, `Direct URL` with 1-tap paste & circular+linear speed ring, and `Downloads` local library with in-app AVPlayer preview, share & delete)
            - 📤 **NEW Uploader Studio UI**: 3-tab Studio (`Telegram Channel/Group` real multipart `sendVideo` uploader with auto-detected chats, AVFoundation thumbnail & resolution inspection, HTML caption templates & Protect Content toggle; `TikTok Studio` with hashtag chips & direct Share/Save; and `Upload Queue & History`)
            - 📺 **Upgraded YouTube Downloader**: Live HD thumbnail preview, 1-tap paste, MP4/MP3 export cards
            - 🔑 **API & Telegram Setup**: `.env` / JSON import, Gemini & DeepSeek API keys with live verification, Telegram Bot & MTProto login
            - ✂️ **AI Ad Cutter & Lossless Trimmer**: Gemini/DeepSeek Vision intro ad scan + lossless `AVAssetExportPresetPassthrough` cutting

            #### 📲 How to Install (Unsigned IPA):
            Install using **TrollStore**, **AltStore**, **SideStore**, **Sideloadly**, **ESign**, **Scarlet**, or **Feather**.
          files: dist/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
