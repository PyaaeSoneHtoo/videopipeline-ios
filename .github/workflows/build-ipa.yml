name: Build and Release Unsigned iOS IPA

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile iOS Unsigned IPA (MTProto TDLib)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Package Dependencies (TDLibKit)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VideoPipelineSuite.xcodeproj \
            -scheme VideoPipelineSuite \
            -derivedDataPath build

      - name: Compile Release App (Unsigned arm64 + TDLib MTProto)
        run: |
          xcodebuild \
            -project VideoPipelineSuite.xcodeproj \
            -scheme VideoPipelineSuite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned IPA
        run: |
          mkdir -p dist/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found!"
            exit 1
          fi
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -r -y VideoPipelineSuite-v1.3.3-unsigned.ipa Payload
          rm -rf Payload
          ls -lh VideoPipelineSuite-v1.3.3-unsigned.ipa

      - name: Upload Unsigned IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPipelineSuite-iOS-Unsigned-IPA
          path: dist/*.ipa
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.3-ios
          name: "Video Pipeline Suite for iOS v1.3.3 (Smart Gemini Model & MTProto)"
          body: |
            ### 🍎 Video Pipeline Suite for iOS v1.3.3 (Smart Gemini Auto-Model & MTProto)

            Official **Video Pipeline Suite** logo + full personal **Telegram MTProto** engine (**Team & Business Plans**):
            - 🤖 **Smart Gemini Model Discovery & Auto-Cascade (Like PC)**: Automatically fetches live supported models (`gemini-2.0-flash`, `gemini-1.5-flash`, etc.) and auto-cascades so deprecated/missing models (like `gemini-2.5-flash`) never cause errors!
            - 📱 **All-in-One Telegram MTProto Login**: Enter your **Mobile Phone Number** (`+959...` / `+1...`), **API ID**, and **API Hash** directly on the same screen — tap **"Send OTP Verification Code"** for seamless 1-tap authentication!
            - 🔓 **Download Restricted Channel Videos**: Browse all your joined Telegram channels & groups — including **Save/Forward-Restricted** channels — or paste any `t.me/...` post link to download up to **2 GB+** original-quality videos straight to iOS Files
            - 📤 **MTProto Uploader Studio (Up to 2 GB)**: Upload videos directly to your Telegram channels/groups with AVFoundation thumbnails, caption templates, Protect Content toggle, live progress & TikTok Studio
            - 🔑 **API Setup & `.env` Import**: Configure & verify **Google Gemini** and **DeepSeek** API keys or import `.env`/JSON from PC
            - ✂️ **AI Ad Cutter & Lossless Trimmer**: Gemini/DeepSeek Vision intro ad scan + lossless `AVAssetExportPresetPassthrough` cutting
            - 🏷️ **Batch Video Renamer**: Strip Telegram IDs, Fast Regex, Gemini & DeepSeek AI renaming
            - 🔒 **License Plan Policy**: Included with **Team (2 PCs)** & **Business (3 PCs)** plans (not available for Personal 1 PC plan)

            #### 📲 How to Install (Unsigned IPA):
            Install using **TrollStore**, **AltStore**, **SideStore**, **Sideloadly**, **ESign**, **Scarlet**, or **Feather**.
          files: dist/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
